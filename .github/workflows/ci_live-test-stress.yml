name: "CI: setup-skrog stress test"

"on":
  workflow_dispatch:
    inputs:
      samples:
        description: Number of setup-skrog attempts to run (1-100).
        required: false
        default: 50
        type: number

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    name: Prepare stress-test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Generate test matrix
        id: generate
        env:
          SAMPLES: ${{ inputs.samples }}
        run: |
          set -euo pipefail
          if ! [[ "${SAMPLES}" =~ ^[0-9]+$ ]] || (( SAMPLES < 1 || SAMPLES > 100 )); then
            echo "samples must be an integer between 1 and 100." >&2
            exit 1
          fi

          matrix="$(jq --compact-output --null-input --argjson samples "${SAMPLES}" '
            [range(1; $samples + 1) as $sample |
              {sample: $sample}]
          ')"
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"

  setup-skrog:
    name: Setup Skrog (sample ${{ matrix.sample }})
    needs: prepare-matrix
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Set up Skrog
        id: setup_skrog
        continue-on-error: true
        timeout-minutes: 5
        uses: wslkit/setup-skrog@cd2cba80924975b0c77217947c228da8aac17b1f # v2.0.0
        with:
          version: "0.10.0"

      - name: Check setup result
        if: always()
        shell: pwsh
        env:
          SETUP_OUTCOME: ${{ steps.setup_skrog.outcome }}
        run: |
          if ($env:SETUP_OUTCOME -ne 'success') {
            throw "Skrog setup failed."
          }

  summarize-results:
    name: Summarize setup-skrog results
    needs:
      - prepare-matrix
      - setup-skrog
    if: ${{ always() && needs.prepare-matrix.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Count live-test results
        env:
          EXPECTED_SAMPLES: ${{ inputs.samples }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="$(
            gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100"
          )"

          summary="$(jq --exit-status --argjson expected_samples "${EXPECTED_SAMPLES}" '
            [
              .[]
              | .jobs[]
              | select(.name | test("^Setup Skrog \\(sample [0-9]+\\)$"))
            ] as $setup_jobs
            | {
                total: ($setup_jobs | length),
                failures: ($setup_jobs | map(select(.conclusion == "failure")) | length),
                complete: ($setup_jobs | all(.conclusion == "success" or .conclusion == "failure"))
              }
            | select(
                .total == $expected_samples
                and .complete
              )
          ' <<< "${jobs}")"

          failures="$(jq -r '.failures' <<< "${summary}")"
          total="$(jq -r '.total' <<< "${summary}")"

          {
            echo "## Setup-skrog stress summary"
            echo
            echo "- Setup Skrog: ${failures} of ${total} failures"
          } >> "${GITHUB_STEP_SUMMARY}"
